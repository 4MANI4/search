<!DOCTYPE html>
<html lang="en">
<head>
    <title>Search</title>

    <style>
        body {
            background-color:#1f2125;
            margin: 0;
            height: 100vh;
        }

        form {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #tbox {
            background-color: #4e5257;
            width: 700px;
            height: 70px;
            padding: 0 16px;
            font-size: 16px;
            border: 1px solid #4e5257;
            border-radius: 50px;
            outline: none;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        
        }

        #tbox:hover {
            box-shadow: 0 1px 6px 2px rgba(31, 33, 36, 0.28);
            background-color: #5f6368
        }

        .bbox {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px 10px;
            padding: 10px 30px;
            font-size: 16px;
            color: #ffffff;
            border: 1px solid #303134;
            border-radius: 4px;
            cursor: pointer;
            background-color: #303134;
            border-radius: 10px;
        }

        .bbox:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        .links {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .links button {
            margin-left: 10px;
        }

        #logo{
            width:80%
        }
    </style>
</head>

<body>


    <div class="links">
        <button onclick="location='https://images.google.com/'" class="bbox">Google image search</button>
        <button onclick="location='https://www.google.com/advanced_search'" class="bbox">Google advanced search</button>
    </div>

    <form action="https://www.google.com/search">
        <img src="Screenshot 2025-12-26 193443.png" alt="google logo" id="logo">
        <br>
        <input type="text" name="q" id="tbox">
        <br>
        <input type="submit" value="Google Search" class="bbox">
        <input type="submit" value="I'm Feeling Lucky" class="bbox">
    </form>

</body>
</html>
